services:
  web:
    build: .
    restart: unless-stopped
    env_file: server/.env.shared
    environment:
      PORT: "8000"
      UPLOAD_DIR: /app/server/uploads
      DATABASE_SSL: "true"
      DATABASE_SSL_CA: /app/server/certs/ca.pem
    ports:
      - "${VIECO_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ./server/uploads:/app/server/uploads
      - ./server/certs:/app/server/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
